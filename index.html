<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>🎂 Chúc Mừng Sinh Nhật - Thổi Nến Bằng Mic</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Lato:wght@300;400&display=swap" rel="stylesheet">
  <style>
    /* ---------- GIỮ NGUYÊN TOÀN BỘ CSS CỦA BẠN ---------- */
    :root {
      --pink: #ff4d8d;
      --gold: #ffd166;
      --purple: #a855f7;
      --cyan: #06d6a0;
      --bg1: #0d0020;
      --bg2: #1a003a;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(ellipse at 30% 20%, #2a004a 0%, var(--bg1) 60%),
                  radial-gradient(ellipse at 80% 80%, #0a001f 0%, transparent 60%);
      min-height: 100vh;
      overflow: hidden;
      font-family: 'Lato', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: default;
    }
    .stars { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
    .star { position: absolute; border-radius: 50%; background: #fff; animation: twinkle var(--d) ease-in-out infinite alternate; opacity: 0; }
    @keyframes twinkle { from { opacity: 0.1; transform: scale(0.8); } to { opacity: 0.9; transform: scale(1.2); } }
    canvas { position: fixed; inset: 0; pointer-events: none; z-index: 1; }
    .card {
      position: relative; z-index: 10; text-align: center; padding: 48px 40px 44px;
      max-width: 580px; width: 100%; background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.10); border-radius: 32px;
      backdrop-filter: blur(24px); box-shadow: 0 0 0 1px rgba(255,77,141,0.15), 0 30px 80px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.12);
      animation: cardIn 1s cubic-bezier(0.16,1,0.3,1) both; max-height: 95vh; overflow-y: auto; scrollbar-width: none;
    }
    .card::-webkit-scrollbar { display: none; }
    @keyframes cardIn { from { opacity:0; transform: translateY(40px) scale(0.95); } to { opacity:1; transform: translateY(0) scale(1); } }
    .title {
      font-family: 'Playfair Display', serif; font-size: clamp(2rem, 5vw, 3rem); font-weight: 900;
      background: linear-gradient(135deg, var(--gold) 0%, var(--pink) 50%, var(--purple) 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      line-height: 1.15; margin-bottom: 32px; animation: titleGlow 3s ease-in-out infinite alternate;
    }
    @keyframes titleGlow { from { filter: drop-shadow(0 0 8px rgba(255,209,102,0.4)); } to { filter: drop-shadow(0 0 20px rgba(255,77,141,0.7)); } }
    
    /* Cake area (giống phiên bản thay ảnh) */
    .cake-area { position: relative; width: 200px; height: 220px; margin: 0 auto 28px; transition: all 0.3s ease; }
    .cake-wrap {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; cursor: pointer;
      animation: sway 4s ease-in-out infinite alternate; filter: drop-shadow(0 20px 40px rgba(255,77,141,0.35));
      transition: opacity 0.3s, transform 0.3s;
    }
    .cake-wrap.hide { opacity: 0; pointer-events: none; animation: none; transform: scale(0.8); }
    .portrait-replace {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column;
      align-items: center; justify-content: center; opacity: 0; transform: scale(0.9);
      transition: opacity 0.4s cubic-bezier(0.2,0.9,0.4,1.1), transform 0.4s ease; pointer-events: none;
    }
    .portrait-replace.show { opacity: 1; transform: scale(1); pointer-events: auto; }
    .portrait-replace img { width: 100%; height: auto; max-height: 180px; object-fit: cover; border-radius: 28px; border: 2px solid rgba(255,255,255,0.5); box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
    .btn-restore-cake { background: rgba(255,255,255,0.2); border: none; color: white; font-size: 0.7rem; padding: 4px 12px; border-radius: 40px; margin-top: 8px; cursor: pointer; transition: 0.2s; }
    .btn-restore-cake:hover { background: var(--pink); }
    @keyframes sway { from { transform: rotate(-4deg) translateY(0); } to { transform: rotate(4deg) translateY(-8px); } }
    
    /* Chi tiết bánh */
    .plate { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 210px; height: 14px; background: linear-gradient(180deg, #e8c9a0, #c8a060); border-radius: 50%; box-shadow: 0 6px 20px rgba(0,0,0,0.4); }
    .tier-bottom { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); width: 180px; height: 72px; background: linear-gradient(160deg, #ff6b9d, #ff4d8d, #c9184a); border-radius: 18px 18px 20px 20px; box-shadow: inset 0 4px 12px rgba(255,255,255,0.2), 0 8px 24px rgba(201,24,74,0.5); }
    .tier-bottom::after { content: ''; position: absolute; top: 18px; left: 10px; right: 10px; height: 2px; background: rgba(255,255,255,0.3); border-radius: 2px; }
    .tier-mid { position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%); width: 140px; height: 56px; background: linear-gradient(160deg, #ffd166, #f4a261, #e76f51); border-radius: 14px 14px 16px 16px; box-shadow: inset 0 4px 10px rgba(255,255,255,0.25), 0 6px 18px rgba(231,111,81,0.5); }
    .tier-top { position: absolute; bottom: 132px; left: 50%; transform: translateX(-50%); width: 100px; height: 42px; background: linear-gradient(160deg, #c77dff, #a855f7, #7b2ff7); border-radius: 12px 12px 14px 14px; box-shadow: inset 0 3px 8px rgba(255,255,255,0.2), 0 6px 18px rgba(123,47,247,0.5); }
    .drip { position: absolute; bottom: -10px; width: 10px; height: 18px; background: inherit; border-radius: 0 0 50% 50%; }
    .candles { position: absolute; bottom: 172px; left: 50%; transform: translateX(-50%); display: flex; gap: 14px; }
    .candle { position: relative; width: 10px; height: 40px; border-radius: 4px; }
    .c1 { background: linear-gradient(#fff, #ffe0ef); }
    .c2 { background: linear-gradient(#fff8dc, #ffd166); }
    .c3 { background: linear-gradient(#e0f7fa, #80deea); }
    .candle::before { content: ''; position: absolute; top: -3px; left: 50%; transform: translateX(-50%); width: 3px; height: 6px; background: #333; border-radius: 2px; }
    .flame {
      position: absolute; top: -24px; left: 50%; transform: translateX(-50%);
      width: 14px; height: 20px; background: radial-gradient(ellipse at 50% 80%, #fff 10%, #ffeb3b 40%, #ff9800 75%, transparent 100%);
      border-radius: 50% 50% 30% 30%; animation: flicker 0.15s ease-in-out infinite alternate; filter: blur(0.5px);
    }
    .flame::after { content: ''; position: absolute; inset: 2px; background: radial-gradient(ellipse at 50% 80%, #fff, transparent); border-radius: inherit; }
    @keyframes flicker { 0% { transform: translateX(-50%) scaleX(1) scaleY(1) rotate(-2deg); opacity:1; } 100% { transform: translateX(-50%) scaleX(0.85) scaleY(1.12) rotate(2deg); opacity:0.85; } }
    .glow { position: absolute; top: -30px; left: 50%; transform: translateX(-50%); width: 36px; height: 36px; background: radial-gradient(circle, rgba(255,200,0,0.55) 0%, transparent 70%); border-radius: 50%; animation: flicker 0.15s ease-in-out infinite alternate; }
    .dot { position: absolute; border-radius: 50%; background: rgba(255,255,255,0.7); }

    /* Khói */
    .smoke {
      position: absolute; top: -30px; left: 50%; transform: translateX(-50%);
      width: 30px; height: 30px; background: radial-gradient(circle, rgba(200,200,200,0.6) 0%, rgba(150,150,150,0) 80%);
      border-radius: 50%; opacity: 0; pointer-events: none; animation: smokeRise 1s ease-out forwards;
    }
    @keyframes smokeRise {
      0% { opacity: 0.6; transform: translateX(-50%) translateY(0) scale(0.5); }
      100% { opacity: 0; transform: translateX(-50%) translateY(-40px) scale(2); }
    }

    .message-wrap { min-height: 88px; display: flex; align-items: center; justify-content: center; margin-bottom: 28px; }
    #message { font-size: 1.15rem; color: rgba(255,220,240,0.92); line-height: 1.8; font-weight: 300; letter-spacing: 0.02em; }
    .cursor { display: inline-block; width: 2px; height: 1.1em; background: var(--pink); margin-left: 2px; vertical-align: text-bottom; animation: blink 0.7s step-end infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    .btn-row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 10px; }
    .btn { padding: 12px 28px; border: none; border-radius: 100px; font-family: 'Lato', sans-serif; font-size: 0.9rem; font-weight: 400; letter-spacing: 0.05em; cursor: pointer; transition: transform 0.15s, box-shadow 0.15s; position: relative; overflow: hidden; }
    .btn::before { content: ''; position: absolute; inset: 0; background: rgba(255,255,255,0.12); opacity: 0; transition: opacity 0.2s; }
    .btn:hover::before { opacity: 1; }
    .btn:active { transform: scale(0.96); }
    .btn-music { background: linear-gradient(135deg, #ff4d8d, #a855f7); color: #fff; box-shadow: 0 8px 24px rgba(255,77,141,0.4); }
    .btn-confetti { background: linear-gradient(135deg, #ffd166, #f4a261); color: #1a0030; box-shadow: 0 8px 24px rgba(255,209,102,0.35); }
    .btn-mic { background: linear-gradient(135deg, #06d6a0, #0284c7); color: white; box-shadow: 0 8px 24px rgba(6,214,160,0.4); }
    .btn-relight { background: linear-gradient(135deg, #aaa, #666); color: white; }
    .mic-status { font-size: 0.8rem; margin: 8px auto 0; color: #ccc; background: rgba(0,0,0,0.5); display: inline-block; padding: 4px 12px; border-radius: 60px; }
    
    #toast { position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%) translateY(80px); background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.2); backdrop-filter: blur(16px); color: #fff; padding: 14px 28px; border-radius: 100px; font-size: 1rem; z-index: 999; transition: transform 0.4s cubic-bezier(0.16,1,0.3,1), opacity 0.4s; opacity: 0; pointer-events: none; white-space: nowrap; }
    #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  </style>
</head>
<body>
  <div class="stars" id="stars"></div>
  <canvas id="canvas"></canvas>

  <div class="card">
    <h1 class="title">🎂 Chúc Mừng<br>Sinh Nhật 🎉</h1>

    <div class="cake-area">
      <div class="cake-wrap" id="cakeWrap">
        <div class="plate"></div>
        <div class="tier-bottom"><div class="drip" style="left:20px"></div><div class="drip" style="left:50px"></div><div class="drip" style="right:30px"></div><div class="dot" style="width:8px;height:8px;top:12px;left:18px"></div><div class="dot" style="width:6px;height:6px;top:30px;right:22px"></div><div class="dot" style="width:10px;height:10px;top:20px;left:50%"></div></div>
        <div class="tier-mid"><div class="drip" style="left:16px"></div><div class="drip" style="right:22px"></div><div class="dot" style="width:7px;height:7px;top:16px;left:30px"></div><div class="dot" style="width:9px;height:9px;top:10px;right:28px"></div></div>
        <div class="tier-top"><div class="drip" style="left:20px"></div><div class="drip" style="right:18px"></div></div>
        <div class="candles" id="candlesContainer">
          <div class="candle c1"><div class="glow"></div><div class="flame" id="flame1"></div></div>
          <div class="candle c2"><div class="glow"></div><div class="flame" id="flame2"></div></div>
          <div class="candle c3"><div class="glow"></div><div class="flame" id="flame3"></div></div>
        </div>
      </div>
      <div class="portrait-replace" id="portraitReplace">
        <img id="portraitImg" src="" alt="Chân dung">
        <button id="restoreCakeBtn" class="btn-restore-cake">🍰 Trở lại bánh kem</button>
      </div>
    </div>

    <div class="message-wrap"><p id="message"><span class="cursor"></span></p></div>

    <div class="btn-row">
      <button class="btn btn-music" id="musicBtn">🎵 Phát Nhạc</button>
      <button class="btn btn-confetti" id="confettiBtn">🎊 Pháo Hoa & Ảnh</button>
      <button class="btn btn-mic" id="micBtn">🎤 Kích hoạt Micro</button>
      <button class="btn btn-relight" id="relightBtn">🕯️ Thắp lại nến</button>
    </div>
    <div id="micStatus" class="mic-status">🔴 Mic chưa kích hoạt</div>
  </div>
  <div id="toast"></div>
  <audio id="bgMusic" loop><source src="https://media.vole.wtf/happy-birthday/jazz-trio.mp3" type="audio/mpeg"></audio>

  <script>
    // ---------- CẤU HÌNH ẢNH CỦA BẠN ----------
    const portraitUrl = "tu_hoa_PA.jpg";  // ĐỔI TÊN ẢNH CHO ĐÚNG

    // ---------- BIẾN TOÀN CỤC ----------
    let mediaStream = null;
    let audioContext = null;
    let sourceNode = null;
    let analyserNode = null;
    let micActive = false;
    let animationId = null;
    let candlesLit = true;   // trạng thái nến đang cháy

    // DOM elements
    const flame1 = document.getElementById('flame1');
    const flame2 = document.getElementById('flame2');
    const flame3 = document.getElementById('flame3');
    const glow1 = document.querySelector('.c1 .glow');
    const glow2 = document.querySelector('.c2 .glow');
    const glow3 = document.querySelector('.c3 .glow');
    const micBtn = document.getElementById('micBtn');
    const relightBtn = document.getElementById('relightBtn');
    const micStatusDiv = document.getElementById('micStatus');

    // Hàm tạo khói tạm thời
    function addSmoke(candleElement) {
      const smoke = document.createElement('div');
      smoke.className = 'smoke';
      const candleRect = candleElement.getBoundingClientRect();
      const cakeWrapRect = document.getElementById('cakeWrap').getBoundingClientRect();
      // vị trí tương đối trong cake-wrap
      const leftOffset = candleRect.left - cakeWrapRect.left + candleRect.width/2;
      smoke.style.left = leftOffset + 'px';
      smoke.style.top = '-10px';
      document.getElementById('cakeWrap').appendChild(smoke);
      setTimeout(() => smoke.remove(), 1000);
    }

    // Hàm tắt nến
    function blowOutCandles() {
      if (!candlesLit) return; // đã tắt rồi
      candlesLit = false;
      // Ẩn flame và glow
      const flames = document.querySelectorAll('.flame');
      const glows = document.querySelectorAll('.glow');
      flames.forEach(flame => { flame.style.opacity = '0'; flame.style.animation = 'none'; });
      glows.forEach(glow => { glow.style.opacity = '0'; glow.style.animation = 'none'; });
      
      // Hiệu ứng khói
      const candles = document.querySelectorAll('.candle');
      candles.forEach(candle => addSmoke(candle));
      
      // Bắn pháo hoa ăn mừng
      const canvas = document.getElementById('canvas');
      const points = [
        [canvas.width * 0.2, canvas.height * 0.3],
        [canvas.width * 0.5, canvas.height * 0.2],
        [canvas.width * 0.8, canvas.height * 0.3]
      ];
      points.forEach(([x,y], i) => setTimeout(() => scheduleBurst(x, y, 50), i * 100));
      
      showToast('🎉 Bạn đã thổi tắt nến! Chúc mừng sinh nhật! 🎉');
    }

    // Hàm thắp lại nến
    function relightCandles() {
      if (candlesLit) return;
      candlesLit = true;
      const flames = document.querySelectorAll('.flame');
      const glows = document.querySelectorAll('.glow');
      flames.forEach(flame => { flame.style.opacity = ''; flame.style.animation = ''; });
      glows.forEach(glow => { glow.style.opacity = ''; glow.style.animation = ''; });
      showToast('🕯️ Nến đã được thắp lại! Hãy thổi nào!');
    }

    // ---------- KHỞI TẠO MICROPHONE ----------
    async function initMicrophone() {
      if (audioContext && audioContext.state !== 'closed') {
        // Nếu đã có, đóng lại để khởi tạo mới
        if (mediaStream) {
          mediaStream.getTracks().forEach(track => track.stop());
        }
        if (audioContext) await audioContext.close();
      }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaStream = stream;
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        analyserNode = audioContext.createAnalyser();
        analyserNode.fftSize = 256;
        sourceNode = audioContext.createMediaStreamSource(stream);
        sourceNode.connect(analyserNode);
        // Không cần kết nối output để tránh hú
        // Bắt đầu phân tích
        const bufferLength = analyserNode.frequencyBinCount;
        const dataArray = new Uint8Array(bufferLength);
        
        function detectBlow() {
          if (!micActive || !analyserNode) return;
          analyserNode.getByteFrequencyData(dataArray);
          let sum = 0;
          for (let i = 0; i < bufferLength; i++) sum += dataArray[i];
          let avg = sum / bufferLength;
          // Ngưỡng phát hiện tiếng thổi (có thể điều chỉnh)
          if (avg > 70 && candlesLit) {
            blowOutCandles();
          }
          requestAnimationFrame(detectBlow);
        }
        
        // Khởi động AudioContext (cần user gesture)
        await audioContext.resume();
        micActive = true;
        micStatusDiv.innerHTML = '🎙️ Mic đang hoạt động! Hãy thổi vào micro để tắt nến.';
        micBtn.textContent = '🎤 Mic đang bật';
        micBtn.disabled = true;
        detectBlow();
      } catch (err) {
        console.error('Lỗi microphone:', err);
        micStatusDiv.innerHTML = '❌ Không thể truy cập mic. Hãy kiểm tra quyền trình duyệt.';
        micActive = false;
      }
    }

    // Ngắt mic
    function stopMicrophone() {
      if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
      }
      if (audioContext) {
        audioContext.close();
      }
      micActive = false;
      micStatusDiv.innerHTML = '🔴 Mic đã dừng. Nhấn "Kích hoạt Mic" để thổi nến.';
      micBtn.textContent = '🎤 Kích hoạt Micro';
      micBtn.disabled = false;
    }

    micBtn.addEventListener('click', () => {
      if (!micActive) {
        initMicrophone();
      } else {
        stopMicrophone();
      }
    });
    relightBtn.addEventListener('click', relightCandles);

    // ---------- CÁC CHỨC NĂNG CŨ (STARS, CANVAS, PHÁO HOA, CAKE, ẢNH) ----------
    // (Giữ nguyên toàn bộ code pháo hoa, stars, canvas từ phiên bản trước, chỉ bổ sung hàm scheduleBurst nếu thiếu)
    // Tạo stars
    const starsEl = document.getElementById('stars');
    for (let i = 0; i < 120; i++) {
      const s = document.createElement('div');
      s.className = 'star';
      const size = Math.random() * 2.5 + 0.5;
      s.style.cssText = `width:${size}px; height:${size}px; top:${Math.random()*100}%; left:${Math.random()*100}%; --d:${(Math.random()*3+1.5).toFixed(1)}s; animation-delay:${(Math.random()*4).toFixed(1)}s;`;
      starsEl.appendChild(s);
    }

    // Canvas particles
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);
    const COLORS = ['#ffd166','#ff4d8d','#a855f7','#06d6a0','#ff6b6b','#80deea','#f4a261','#fff'];
    const MAX_PARTICLES = 600;
    const pool = [];
    const active = [];
    function getParticle() { return pool.length ? pool.pop() : {}; }
    function spawnRain() {
      if (active.length >= MAX_PARTICLES) return;
      const p = getParticle();
      p.x = Math.random() * canvas.width; p.y = -16; p.vx = (Math.random() - 0.5) * 1.2; p.vy = Math.random() * 2.5 + 1.2; p.size = Math.random() * 9 + 5; p.rot = Math.random() * Math.PI * 2; p.rotV = (Math.random() - 0.5) * 0.08; p.color = COLORS[Math.floor(Math.random() * COLORS.length)]; p.shape = Math.random() > 0.5 ? 0 : (Math.random() > 0.5 ? 1 : 2); p.life = 1; p.decay = 0.004; p.gravity = 0.025; p.burst = false;
      active.push(p);
    }
    function scheduleBurst(cx, cy, total) {
      const perFrame = 12; const delay = 1000 / 60; let spawned = 0;
      function step() {
        const n = Math.min(perFrame, total - spawned);
        for (let i = 0; i < n; i++) {
          if (active.length >= MAX_PARTICLES) break;
          const p = getParticle();
          const angle = Math.random() * Math.PI * 2; const speed = Math.random() * 10 + 2;
          p.x = cx; p.y = cy; p.vx = Math.cos(angle) * speed; p.vy = Math.sin(angle) * speed - 4; p.size = Math.random() * 10 + 5; p.rot = Math.random() * Math.PI * 2; p.rotV = (Math.random() - 0.5) * 0.14; p.color = COLORS[Math.floor(Math.random() * COLORS.length)]; p.shape = Math.floor(Math.random() * 3); p.life = 1; p.decay = 0.010 + Math.random() * 0.008; p.gravity = 0.38; p.burst = true;
          active.push(p);
        }
        spawned += n;
        if (spawned < total) setTimeout(step, delay);
      }
      step();
    }
    function drawCircle(p) { ctx.beginPath(); ctx.arc(0, 0, p.size * 0.5, 0, Math.PI * 2); ctx.fillStyle = p.color; ctx.fill(); }
    function drawRect(p) { const h = p.size * 0.5; ctx.fillStyle = p.color; ctx.fillRect(-h * 0.55, -h * 0.35, h * 1.1, h * 0.7); }
    function drawTri(p) { const h = p.size * 0.6; ctx.beginPath(); ctx.moveTo(0, -h); ctx.lineTo(h * 0.85, h * 0.6); ctx.lineTo(-h * 0.85, h * 0.6); ctx.closePath(); ctx.fillStyle = p.color; ctx.fill(); }
    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = active.length - 1; i >= 0; i--) {
        const p = active[i];
        p.vy += p.gravity; p.x += p.vx; p.y += p.vy; p.rot += p.rotV; p.life -= p.decay;
        if (p.life <= 0 || p.y > canvas.height + 40) { active[i] = active[active.length - 1]; active.pop(); pool.push(p); continue; }
        ctx.save(); ctx.globalAlpha = Math.max(0, p.life); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        if (p.shape === 0) drawCircle(p); else if (p.shape === 1) drawRect(p); else drawTri(p);
        ctx.restore();
      }
      requestAnimationFrame(animateParticles);
    }
    animateParticles();
    setInterval(spawnRain, 80);

    // Cake click
    document.getElementById('cakeWrap').addEventListener('click', (e) => {
      const r = e.currentTarget.getBoundingClientRect();
      scheduleBurst(r.left + r.width / 2, r.top + r.height / 2, 100);
      showToast('🎉 Chúc mừng sinh nhật! Hy vọng bạn thật hạnh phúc ❤️');
    });

    // Ảnh thay bánh
    const confettiBtn2 = document.getElementById('confettiBtn');
    const portraitReplace = document.getElementById('portraitReplace');
    const portraitImg = document.getElementById('portraitImg');
    const restoreCakeBtn = document.getElementById('restoreCakeBtn');
    portraitImg.src = portraitUrl;
    function replaceCakeWithPhoto() { document.getElementById('cakeWrap').classList.add('hide'); portraitReplace.classList.add('show'); }
    function restoreCake() { document.getElementById('cakeWrap').classList.remove('hide'); portraitReplace.classList.remove('show'); }
    restoreCakeBtn.addEventListener('click', restoreCake);
    confettiBtn2.addEventListener('click', () => {
      const points = [[canvas.width*0.2, canvas.height*0.3],[canvas.width*0.5, canvas.height*0.2],[canvas.width*0.8, canvas.height*0.3],[canvas.width*0.35, canvas.height*0.5],[canvas.width*0.65, canvas.height*0.5]];
      points.forEach(([x,y], i) => setTimeout(() => scheduleBurst(x, y, 60), i*120));
      replaceCakeWithPhoto();
      showToast('📸 Ảnh chân dung đã thay thế bánh kem!');
    });

    // Music
    const music = document.getElementById('bgMusic'); const musicBtn = document.getElementById('musicBtn'); let playing = false;
    musicBtn.addEventListener('click', () => { if(!playing) { music.play().catch(()=>{}); musicBtn.textContent='⏸ Tắt Nhạc'; playing=true; } else { music.pause(); musicBtn.textContent='🎵 Phát Nhạc'; playing=false; } });
    let toastTimer; function showToast(msg) { const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),3500); }
    const wish = ['Chúc mừng sinh nhật vui vẻ! 🎂','Chúc bạn luôn tràn đầy hạnh phúc,','thành công và yêu thương mỗi ngày 💖'];
    function typeLines(lines) { const el=document.getElementById('message'); el.innerHTML=''; let lineIdx=0, charIdx=0; let node=document.createTextNode(''); const cursor=document.createElement('span'); cursor.className='cursor'; el.appendChild(node); el.appendChild(cursor); function tick(){ if(lineIdx>=lines.length) return; const line=lines[lineIdx]; if(charIdx<line.length){ node.textContent+=line[charIdx++]; setTimeout(tick,32); } else { lineIdx++; charIdx=0; if(lineIdx<lines.length){ el.insertBefore(document.createElement('br'), cursor); node=document.createTextNode(''); el.insertBefore(node, cursor); setTimeout(tick,260); } } } tick(); }
    window.addEventListener('load', () => typeLines(wish));
  </script>
</body>
</html>
